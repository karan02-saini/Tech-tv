name: Daily IPTV Channel Update

on:
  schedule:
    - cron: '0 0 * * *' # Har roz raat ko 12 baje UTC par run hoga
  workflow_dispatch: # Isse tu GitHub website se manually ek click me bhi run kar sakega

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: python update_channels.py

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update channels.json [skip ci]" && git push)
