name: Auto Update Live Events

on:
  schedule:
    # Har 30 minute me automatically chalega
    - cron: '*/30 * * * *'
  workflow_dispatch: # Manual run karne ke liye

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Scraper Script
        run: python update_events.py

      - name: Commit and Push Updated events.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add events.json
          git commit -m "Auto-update live events" || exit 0
          git push
